# Mirrors the Vite dev proxy (frontend/vite.config.ts):
#   /api/* → http://app:8000/* (prefix stripped)
#   /ws/*  → ws://app:8000/*  (prefix stripped, WebSocket upgrade)
#
# FastAPI routers are mounted at the root (e.g. /chat/ws, /health), so the
# nginx rewrite strips the /api or /ws prefix before forwarding.

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Strip /api prefix before forwarding.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Strip /ws prefix; upgrade to WebSocket.
    location /ws/ {
        rewrite ^/ws/(.*)$ /$1 break;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
