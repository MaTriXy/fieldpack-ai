[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests that require a running Ollama instance (deselected by default)",
    "integration: tests that use real ChromaDB/SQLite but mock LLM calls",
    "e2e: end-to-end tests that drive the real running stack over HTTP (opt-in via -m e2e)",
]
